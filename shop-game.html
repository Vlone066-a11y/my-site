<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Касса Судного Дня — Симулятор кассира</title>
    <style>
        :root {
            --bg-main: #070b14;
            --bg-card: #111827;
            --bg-panel: #1e293b;
            --border: #334155;
            --primary: #0284c7;
            --primary-light: #38bdf8;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text: #f8fafc;
            --muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at top, #1e293b 0%, var(--bg-main) 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .game-shell {
            width: 100%;
            max-width: 860px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.8);
        }

        /* Верхняя панель управления */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .game-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--primary-light);
            letter-spacing: 0.5px;
        }

        .sound-toggle {
            background-color: var(--bg-panel);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .sound-toggle:hover {
            border-color: var(--primary-light);
        }

        /* Панель статистики */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 12px;
            background-color: #090d16;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 18px;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-title {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--muted);
        }

        .stat-val {
            font-size: 1.15rem;
            font-weight: 800;
        }

        .val-rank { color: var(--primary-light); }
        .val-pos { color: var(--success); }
        .val-neg { color: var(--danger); }
        .val-streak { color: var(--warning); }

        /* Сюжетное окно */
        .story-panel {
            background: rgba(56, 189, 248, 0.08);
            border-left: 4px solid var(--primary-light);
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 18px;
            font-size: 0.94rem;
            line-height: 1.55;
            color: #e2e8f0;
        }

        .story-panel.danger {
            background: rgba(239, 68, 68, 0.12);
            border-left-color: var(--danger);
            color: #fecaca;
        }

        .story-panel.gold {
            background: rgba(245, 158, 11, 0.12);
            border-left-color: var(--warning);
            color: #fef3c7;
        }

        /* Шкала карьерной лестницы */
        .ranks-strip {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 18px;
        }

        .rank-pill {
            background-color: #090d16;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 0.75rem;
            white-space: nowrap;
            color: var(--muted);
        }

        .rank-pill.current {
            background-color: rgba(56, 189, 248, 0.15);
            border-color: var(--primary-light);
            color: var(--primary-light);
            font-weight: 700;
        }

        /* Экран 1: Документ с ценами */
        .doc-toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .search-field {
            flex: 1;
            min-width: 220px;
            background-color: #090d16;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 16px;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }

        .search-field:focus {
            border-color: var(--primary-light);
        }

        .count-badge {
            background-color: var(--bg-panel);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.88rem;
            color: var(--muted);
            font-weight: 600;
            display: flex;
            align-items: center;
        }

        .catalog-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(225px, 1fr));
            gap: 8px;
            max-height: 360px;
            overflow-y: auto;
            background-color: #090d16;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 18px;
        }

        .item-tile {
            background-color: var(--bg-panel);
            border: 1px solid #2d3748;
            border-radius: 8px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.88rem;
        }

        .item-tile-price {
            color: var(--primary-light);
            font-weight: 800;
            margin-left: 8px;
            white-space: nowrap;
        }

        /* Экран 2: Кассовый аппарат */
        .patience-box {
            background-color: #090d16;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 16px;
        }

        .patience-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .timer-clock {
            font-family: monospace;
            font-size: 1.1rem;
            font-weight: 800;
        }

        .bar-track {
            width: 100%;
            height: 12px;
            background-color: var(--bg-panel);
            border-radius: 999px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            width: 100%;
            background-color: var(--success);
            transition: width 0.1s linear, background-color 0.25s ease;
        }

        /* Бумажный чек */
        .receipt-card {
            background-color: #f8fafc;
            color: #0f172a;
            border-radius: 14px;
            padding: 20px;
            font-family: "Courier New", Courier, monospace;
            margin-bottom: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        .receipt-head {
            text-align: center;
            border-bottom: 2px dashed #94a3b8;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .receipt-head h3 {
            font-size: 1.1rem;
        }

        .receipt-head p {
            font-size: 0.82rem;
            color: #475569;
            margin-top: 4px;
        }

        .receipt-rows {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .receipt-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 6px;
            border-bottom: 1px dotted #cbd5e1;
            font-size: 1.05rem;
            font-weight: 700;
        }

        .tag-secret {
            background-color: #e2e8f0;
            color: #64748b;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .tag-known {
            background-color: #dbeafe;
            color: #0369a1;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.95rem;
        }

        .receipt-bottom {
            border-top: 2px dashed #94a3b8;
            padding-top: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #475569;
        }

        /* Подсказки */
        .hints-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }

        .btn-hint {
            background-color: var(--bg-panel);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-hint:hover:not(:disabled) {
            background-color: #334155;
            border-color: var(--primary-light);
        }

        .btn-hint:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Поле ввода суммы */
